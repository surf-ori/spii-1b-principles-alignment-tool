name: Tester feedback on the Self-Assessment Tool
description: Share your experience after trying the Open Science Infrastructure Self-Assessment Tool (usability and content).
title: "[1B tester]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing the [Open Science Infrastructure Self-Assessment Tool](https://surf-ori.github.io/spii-1b-principles-alignment-tool/), part of the SPII project (Strategic Plan on Integrated Infrastructure). It is built on the POSI principles, with complementary principles on autonomy and researcher-centricity added.

        Please complete a self-assessment (a partial one is fine) and tell us how it went. You do not have to answer every question; skip the ones you have no opinion on. A curator will review this issue and record the outcome (accepted, rejected, or already covered) with a short rationale before closing it.

        **Everything you write here is public.** Do not include anything you do not want published.
  - type: input
    id: name
    attributes:
      label: Name
      description: Your name.
    validations:
      required: true
  - type: input
    id: organisation
    attributes:
      label: Organisation
      description: The institution or organisation you are affiliated with.
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role
      description: Your role or function.
    validations:
      required: true
  - type: input
    id: representing-infrastructure
    attributes:
      label: "Representing infrastructure:"
      description: The infrastructure or tool you assessed or represent, if any.
    validations:
      required: false
  - type: input
    id: frameworks-used
    attributes:
      label: Framework(s) you used
      description: For example POSI v2.0 (including the complementary principles), or another framework from "Other assessments".
      placeholder: POSI v2.0
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Browser and device
      description: Helps us reproduce layout problems.
      placeholder: Firefox on a laptop, Chrome on an Android phone, ...
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## 1. Usability
  - type: textarea
    id: usability-navigation
    attributes:
      label: Is the tool easy to navigate and understand?
    validations:
      required: false
  - type: textarea
    id: usability-layout
    attributes:
      label: Is the overall layout and design clear?
    validations:
      required: false
  - type: textarea
    id: usability-own-criteria
    attributes:
      label: Was it clear that you can define your own assessment criteria and definitions?
      description: In the tool this is "Customize scales" under Settings (your own options, icons, colors and descriptions), and importing a framework JSON file for per-principle descriptions.
    validations:
      required: false
  - type: textarea
    id: usability-export
    attributes:
      label: Were you able to generate and export the assessment report without difficulty?
    validations:
      required: false
  - type: textarea
    id: usability-import
    attributes:
      label: Did you know you can also import an existing assessment and then review it in the tool?
      description: Under Import ▾ → Import Assessment Report (JSON).
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## 2. Content
  - type: textarea
    id: content-clarity
    attributes:
      label: Are the principles and explanations clear and easy to understand?
    validations:
      required: false
  - type: textarea
    id: content-detail
    attributes:
      label: Is the level of detail sufficient?
    validations:
      required: false
  - type: textarea
    id: content-guidance
    attributes:
      label: Would additional guidance or examples help you better interpret and assess the principles?
      description: If yes, for which principles?
    validations:
      required: false
  - type: textarea
    id: content-missing
    attributes:
      label: Do you miss any principles?
    validations:
      required: false
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: Any other comment, correction, or idea. If something did not work, say what you did and what you expected.
    validations:
      required: false
